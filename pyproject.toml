[project]
name = "hp-460-keyboard-remapper"
version = "0.1.0"
description = "Dependency-free Windows HID utility and protocol research for the HP 460 keyboard"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
hp460 = "hp460:main"
hpac-dev-mode = "hpac_dev_mode:main"
hp460-firmware-analysis = "firmware_analysis:main"

[tool.setuptools]
py-modules = ["hp460", "hpac_dev_mode", "firmware_analysis"]
